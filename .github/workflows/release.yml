name: release

# A tag is the release. `npm run release -- patch|minor|major` writes the
# version, freezes the changelog entry and pushes the tag; this workflow turns
# that tag into a GitHub release whose notes are the changelog section.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tag, package.json and changelog agree
        run: node scripts/release.mjs verify "$GITHUB_REF_NAME"
      - run: npm test
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release.mjs notes "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --title "$version" \
            --notes-file "$RUNNER_TEMP/notes.md"
